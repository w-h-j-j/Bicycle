plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.bicycle'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bicycle"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    dataBinding {
        enabled = true
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def versionName = variant.versionName
                def versionCode = variant.versionCode
                def date = new Date().format('yyyyMMdd_HHmm')

                // 动态识别输出类型
                if (outputFileName.endsWith('.apk')) {
                    outputFileName = "AppName_v${versionName}_${versionCode}_${date}.apk"
                } else if (outputFileName.endsWith('.aab')) {
                    outputFileName = "AppName_v${versionName}_${versionCode}_${date}.aab"
                }
            }
        }
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //implementation(name: 'sdk-4.10.4', ext: 'aar')
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.11'


}